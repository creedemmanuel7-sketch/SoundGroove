name: Android security checks

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-security.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-security.yml"
  workflow_dispatch:

jobs:
  lint-security:
    name: Lint (security config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # MobSF (optionnel) : scanner d’APK hors pipeline par défaut (image lourde).
  # Décommenter ou lancer manuellement après assembleRelease :
  #   docker run -d -p 8000:8000 opensecurity/mobile-security-framework-mobsf:latest
  #   # puis upload de app/build/outputs/apk/release/app-release.apk via l’UI / API REST
  # Voir docs/MOBILE_SECURITY_AUDIT_2026-08-21.md § SAST.
