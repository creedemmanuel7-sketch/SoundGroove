name: Android security checks

on:
  push:
    paths:
      - "app/**"
      - "flutter_queue/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-security.yml"
  pull_request:
    paths:
      - "app/**"
      - "flutter_queue/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-security.yml"
  workflow_dispatch:

jobs:
  lint-security:
    name: Lint (security config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        id: flutter
        with:
          channel: stable
          cache: true

      - name: Flutter pub get (queue module)
        run: flutter pub get
        working-directory: flutter_queue

      - name: Write local.properties
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          FLUTTER_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$SDK_DIR" "$FLUTTER_DIR" > local.properties
          cat local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # MobSF (optionnel) : scanner d’APK hors pipeline par défaut (image lourde).
  # Décommenter ou lancer manuellement après assembleRelease :
  #   docker run -d -p 8000:8000 opensecurity/mobile-security-framework-mobsf:latest
  #   # puis upload de app/build/outputs/apk/release/app-release.apk via l’UI / API REST
  # Voir docs/MOBILE_SECURITY_AUDIT_2026-08-21.md § SAST.
